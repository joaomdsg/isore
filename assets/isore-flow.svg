<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" font-family="-apple-system,&#39;Segoe UI&#39;,Helvetica,Arial,sans-serif" role="img" aria-label="How isore works: you annotate, hand off to your agent over MCP, and badges update live from flagged to working to fixed.">
